<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d62300">
  <title>Entrar — {{ nome }}</title>
  <link rel="stylesheet" href="{{ asset('style.css') }}">
  <link rel="stylesheet" href="{{ asset('admin.css') }}">
</head>
<body class="admin">
  <header class="topo">
    <h1>{{ nome }}</h1>
    <p>Área restrita da lanchonete</p>
  </header>

  <main class="login">
    <form method="post" action="{{ url_for('login') }}" class="painel" autocomplete="on">
      <h2>Entrar no painel</h2>
      {% if erro %}<p class="msg erro" role="alert">{{ erro }}</p>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Usuário
        <input name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus maxlength="50">
      </label>
      <label>Senha
        <input name="senha" type="password" autocomplete="current-password" required maxlength="200">
      </label>
      <button type="submit" class="btn btn-vermelho btn-total">Entrar</button>
    </form>
  </main>
</body>
</html>
